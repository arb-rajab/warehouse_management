name: Setup frontend
description: Install Node and npm dependencies, with npm downloads cached across runs

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm

    - name: Install npm dependencies
      shell: bash
      run: npm ci
