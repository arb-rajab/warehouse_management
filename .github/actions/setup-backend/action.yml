name: Setup backend
description: Install PHP and Composer dependencies, with Composer downloads cached across runs

inputs:
  php-version:
    description: PHP version to install
    default: '8.5'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php-version }}
        tools: composer:v2
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache-dir
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist

    - name: Prepare application environment
      shell: bash
      run: |
        [ -f .env ] || cp .env.example .env
        php artisan key:generate --ansi

    # Merging in the legacy store's routes/controllers (see
    # .ai/rules/legacy-albaraka-holland.md) means any command that resolves
    # every controller to boot the app -- route:list, and Wayfinder's
    # generator, which the Vite plugin also shells out to on every `npm run
    # build` -- now reaches a legacy controller constructor querying
    # BusinessSetting via get_setting(). Every job using this action needs a
    # real (if empty) database for that to succeed, not just the jobs that
    # already provisioned one for their own tests.
    - name: Ensure a database is available
      shell: bash
      run: |
        php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
        php -r "file_exists('database/telescope.sqlite') || touch('database/telescope.sqlite');"
        php -r "file_exists('database/pulse.sqlite') || touch('database/pulse.sqlite');"
        php -r "file_exists('database/health.sqlite') || touch('database/health.sqlite');"
        php artisan migrate --force
