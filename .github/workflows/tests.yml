name: tests

# This workflow used to also run on pushes to main/develop/staging. That run
# existed to gate deploy.yml, which fired on a `workflow_run` completion of this
# workflow -- so every merge paid for a second full suite over content the PR had
# already tested green. (The old comment here justified it as testing a distinct
# commit because "merges here are fast-forward"; that was wrong. Merges into
# develop are real merge commits, but their tree is byte-identical to the PR head
# that was already tested, so the re-run could not produce a different result.)
#
# deploy.yml now triggers on the push directly and gates itself on finding a
# successful run of this workflow covering the merged tree, so the push run here
# bought nothing and has been removed. Use the workflow_dispatch below to run the
# full suite on a branch on demand -- notably to re-establish that gate when a
# merge lands content no PR run covered, because the base moved under the PR.
on:
  # Draft PRs are skipped (see the `plan` job); marking one ready runs the suite.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # deploy.yml calls this workflow when a merge lands content that no pull
  # request run covered, so the merged commit is tested before it is promoted.
  workflow_call:

permissions:
  contents: read

# This only deduplicates runs against the *same* ref, and deliberately does not
# touch the push-triggered run described above. PR runs group by PR number, so
# pushing again to a PR branch cancels only that PR's own superseded run. Every
# other event -- including the push run on develop/staging that deploy.yml gates
# on -- falls back to the run id, which is unique per run, so such a run can
# never be cancelled by, or queued behind, anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides which job groups this run needs, so a pull request pays only for
  # the checks its changes can affect. Two reasons to skip, both on pull
  # request events only -- workflow_dispatch and deploy.yml's workflow_call
  # always run everything:
  #
  # 1. Content already tested. A release PR (develop -> staging, staging -> main)
  #    proposes a head whose tree is byte-identical to a PR head this suite
  #    already passed on, so re-running it cannot produce a different result.
  #    Mirrors deploy.yml's verify-tested: the PR's merge tree must equal its
  #    head's tree (the base adds nothing), and a successful tests run must
  #    exist for that head or, when the head is a merge with an identical tree,
  #    for its second parent.
  # 2. Paths. .github/scripts/ci_plan.py maps the PR's changed files to groups;
  #    its docstring carries the rules (docs-only needs nothing, PHP tests
  #    skip the JS jobs and E2E, any .github/ change needs everything).
  #
  # Every lookup fails open: an API error runs everything. A job skipped by its
  # `if:` still reports a successful check run, so required checks are
  # satisfied rather than left pending. Draft PRs skip this job, and with it
  # every job below.
  plan:
    name: Plan CI jobs
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      php: ${{ steps.plan.outputs.php }}
      mysql: ${{ steps.plan.outputs.mysql }}
      js: ${{ steps.plan.outputs.js }}
      e2e: ${{ steps.plan.outputs.e2e }}
      audit: ${{ steps.plan.outputs.audit }}
      deploy-script: ${{ steps.plan.outputs.deploy-script }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Test the planner
        run: python3 .github/scripts/ci_plan_test.py

      - name: Decide which jobs this change needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          finish() {
            echo "$1"
            python3 .github/scripts/ci_plan.py "${@:2}" | tee -a "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            finish "A $EVENT_NAME run checks everything." --all
          fi

          tree_of() {
            gh api "repos/$REPO/commits/$1" --jq '.commit.tree.sha'
          }

          if ! merge_tree="$(tree_of "$MERGE_SHA")" || ! head_json="$(gh api "repos/$REPO/commits/$HEAD_SHA")"; then
            finish "Could not read the PR's commits; checking everything." --all
          fi

          head_tree="$(jq -r '.commit.tree.sha' <<< "$head_json")"
          candidates=()
          attest_args=()

          if [ "$merge_tree" = "$head_tree" ]; then
            candidates+=("$HEAD_SHA")
            # The head commit may attest a local run of some groups on this tree
            # (.claude/scripts/pre_push_check.py --attest). ci_plan.py honours it
            # only for exactly this tree, and never for a change under .github/.
            jq -r '.commit.message' <<< "$head_json" > "$RUNNER_TEMP/head-message.txt"
            attest_args=(--attested-message-file "$RUNNER_TEMP/head-message.txt" --tree "$head_tree")
            second_parent="$(jq -r 'if (.parents | length) == 2 then .parents[1].sha else "" end' <<< "$head_json")"

            if [ -n "$second_parent" ] && [ "$(tree_of "$second_parent" || true)" = "$head_tree" ]; then
              candidates+=("$second_parent")
            fi
          else
            echo "The base adds content the head lacks; the merged tree is new."
          fi

          for sha in "${candidates[@]}"; do
            successes="$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?head_sha=$sha&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)"

            if [ "${successes:-0}" -gt 0 ]; then
              finish "Tree $head_tree already passed at $sha; skipping the suite. Run this workflow by hand to force it." --none
            fi
          done

          # The files API lists at most 3000 files; a PR that large checks everything.
          if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')"; then
            finish "Could not list the PR's files; checking everything." --all
          fi

          if [ "$(wc -l <<< "$files")" -ge 3000 ]; then
            finish "The PR lists 3000+ files; checking everything." --all
          fi

          echo "$files"
          finish "Planned from the $(wc -l <<< "$files") changed paths above:" "${attest_args[@]}" <<< "$files"

  format-js:
    name: Prettier
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Prettier
        run: npm run format:check

  # ESLint, vue-tsc and Vitest all resolve real imports from the gitignored,
  # generated resources/js/actions and resources/js/wayfinder (`php artisan
  # wayfinder:generate`, the command the Vite Wayfinder plugin also shells
  # out to on build). They run as one job that generates the types once and
  # then runs the three checks. Billing rounds every job up to a whole minute
  # and each repeats checkout and dependency install, so five small jobs
  # (generate, ESLint, vue-tsc, Vitest, and their artifact hand-off) cost more
  # than this one. Each check runs even if an earlier one failed, so a single
  # run reports every failure.
  js-checks:
    name: JS checks (ESLint, vue-tsc, Vitest)
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Generate Wayfinder actions
        run: php artisan wayfinder:generate --skip-routes --with-form

      - name: Run ESLint
        run: npm run lint:check

      - name: Run vue-tsc
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Run Vitest
        if: ${{ !cancelled() }}
        run: npm run test:unit

  lint-php:
    name: Pint
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run Pint
        run: composer lint:check

  # deploy-remote.sh only ever runs on the Hostinger host, over SSH, as part of
  # a real deploy -- nothing else would catch a regression in it before one. Its
  # rollback path drops every table and reloads a dump, so that is not a failure
  # mode to discover in production.
  test-deploy-script:
    name: Deploy script
    needs: plan
    if: needs.plan.outputs.deploy-script == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the remote deploy script
        run: bash .github/scripts/deploy-remote-test.sh

  types-php:
    name: PHPStan
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run PHPStan
        run: composer types:check

  test-php:
    name: Pest
    needs: [plan, lint-php, format-js]
    # Prettier is skipped when only PHP files changed, and Pint when a head-commit
    # attestation already vouches for the php group, and a skipped need would
    # skip this job too, so require each to have passed or been skipped --
    # never failed or cancelled.
    if: >-
      !cancelled() &&
      needs.plan.outputs.php == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Inertia-rendering Pest tests boot the real `app.blade.php` view,
      # which reads public/build/manifest.json via the @vite directive —
      # without a build, every one of those tests fails with "Vite
      # manifest not found" even though nothing here asserts on the built
      # JS itself. This also generates the Wayfinder actions as a
      # byproduct of the Vite plugin, same as the dedicated job above.
      - name: Build frontend assets
        run: npm run build

      # `composer test:pest` runs the suite in one process: about 6.5 minutes,
      # the longest job in the workflow. Paratest (already a Pest dependency)
      # splits it across the runner's cores; every test uses its own in-memory
      # SQLite database, and the same `--parallel` run is what
      # pre_push_check.py uses locally.
      - name: Run Pest
        run: |
          php artisan config:clear --ansi
          php artisan test --parallel

  # The suite runs on in-memory SQLite, but production is MySQL. These are the
  # migration tests whose behaviour differs between the two (foreign-key
  # indexes, fulltext, identifier lengths), run against a real MySQL server.
  # The whole tests/Feature/Database folder (~130 files, each migrating the
  # schema) ran past 20 minutes there without output, so only these run.
  test-php-mysql:
    name: Pest (MySQL migrations)
    needs: [plan, lint-php, format-js]
    # Prettier is skipped when only PHP files changed, and Pint when a head-commit
    # attestation already vouches for the php group, and a skipped need would
    # skip this job too, so require each to have passed or been skipped --
    # never failed or cancelled.
    if: >-
      !cancelled() &&
      needs.plan.outputs.mysql == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: warehouse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: warehouse_test
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run database Pest tests on MySQL
        timeout-minutes: 10
        run: >-
          php artisan test
          tests/Feature/Database/WidenPaymentTransactionCodeTest.php
          tests/Feature/Store/Admin/SellerPayoutDefectsTest.php
          tests/Feature/SellerDashboardTest.php
          tests/Feature/Store/Admin/ProductEditRoutingTest.php
          tests/Feature/Store/Admin/RootProductHandlersTest.php
          tests/Feature/StorefrontNullSlugTest.php
          tests/Feature/StorefrontRemainingBladeUrlTest.php
          tests/Feature/StorefrontRemainingResourceUrlTest.php
          tests/Feature/Store/Admin/DynamicPopupControllerTest.php
          tests/Feature/Store/Admin/CustomerControllerTest.php
          tests/Feature/Database/DropRedundantForeignKeyIndexesTest.php
          tests/Feature/Database/SchemaIdentifierLengthTest.php
          tests/Feature/Database/AddFulltextIndexToProductsTableTest.php
          tests/Feature/Database/AddIndexesToStoreTablesTest.php
          tests/Feature/Database/LoadLegacyReferenceDataTest.php
          tests/Feature/Database/WidenMapLongitudeColumnsTest.php
          tests/Feature/Database/AddSyncedAtToProductsTableTest.php
          tests/Feature/Console/SyncProductsCommandTest.php
          tests/Feature/ProductColumnOwnershipTest.php
          tests/Feature/SellerProductPersistenceTest.php
          tests/Feature/SellerDigitalProductPersistenceTest.php
          tests/Feature/SellerCatalogueRowRulesTest.php
          tests/Feature/Store/Admin/ProductMySqlEditTest.php

  # `composer audit` reads composer.lock and `npm audit` reads
  # package-lock.json, so neither needs the dependencies installed. Abandoned
  # packages are reported but do not fail the run; advisories do.
  audit:
    name: Dependency audit
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --abandoned=report

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E
    needs: [plan, lint-php, format-js]
    # Pint and Prettier are skipped when their group is not planned, which
    # includes a group a head-commit attestation already vouches for, so a
    # skipped need must not skip this job too.
    if: >-
      !cancelled() &&
      needs.plan.outputs.e2e == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Ensure SQLite database files exist
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php -r "file_exists('database/telescope.sqlite') || touch('database/telescope.sqlite');"
          php -r "file_exists('database/pulse.sqlite') || touch('database/pulse.sqlite');"
          php -r "file_exists('database/health.sqlite') || touch('database/health.sqlite');"

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
