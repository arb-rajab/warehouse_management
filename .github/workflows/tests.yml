name: tests

# This workflow used to also run on pushes to main/develop/staging. That run
# existed to gate deploy.yml, which fired on a `workflow_run` completion of this
# workflow -- so every merge paid for a second full suite over content the PR had
# already tested green. (The old comment here justified it as testing a distinct
# commit because "merges here are fast-forward"; that was wrong. Merges into
# develop are real merge commits, but their tree is byte-identical to the PR head
# that was already tested, so the re-run could not produce a different result.)
#
# deploy.yml now triggers on the push directly and gates itself on finding a
# successful run of this workflow covering the merged tree, so the push run here
# bought nothing and has been removed. Use the workflow_dispatch below to run the
# full suite on a branch on demand -- notably to re-establish that gate when a
# merge lands content no PR run covered, because the base moved under the PR.
on:
  pull_request:
  workflow_dispatch:
  # deploy.yml calls this workflow when a merge lands content that no pull
  # request run covered, so the merged commit is tested before it is promoted.
  workflow_call:

permissions:
  contents: read

# This only deduplicates runs against the *same* ref, and deliberately does not
# touch the push-triggered run described above. PR runs group by PR number, so
# pushing again to a PR branch cancels only that PR's own superseded run. Every
# other event -- including the push run on develop/staging that deploy.yml gates
# on -- falls back to the run id, which is unique per run, so such a run can
# never be cancelled by, or queued behind, anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # resources/js/actions and resources/js/wayfinder are gitignored,
  # generated from the app's routes/controllers by `php artisan
  # wayfinder:generate` (the same command the Vite Wayfinder plugin shells
  # out to on build). ESLint, vue-tsc and Vitest all resolve real imports
  # from those directories, so generate them once here and hand them to
  # those jobs instead of every JS job re-running a PHP install just to
  # produce the same output.
  generate-wayfinder:
    name: Generate Wayfinder types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Generate Wayfinder actions
        run: php artisan wayfinder:generate --skip-routes --with-form

      - name: Upload Wayfinder types
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wayfinder-types
          path: |
            resources/js/actions
            resources/js/wayfinder
          retention-days: 1

  lint-js:
    name: ESLint
    needs: generate-wayfinder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Download Wayfinder types
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wayfinder-types
          path: resources/js

      - name: Run ESLint
        run: npm run lint:check

  format-js:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Prettier
        run: npm run format:check

  types-js:
    name: vue-tsc
    needs: generate-wayfinder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Download Wayfinder types
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wayfinder-types
          path: resources/js

      - name: Run vue-tsc
        run: npm run types:check

  test-js:
    name: Vitest
    needs: generate-wayfinder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Download Wayfinder types
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wayfinder-types
          path: resources/js

      - name: Run Vitest
        run: npm run test:unit

  lint-php:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run Pint
        run: composer lint:check

  # deploy-remote.sh only ever runs on the Hostinger host, over SSH, as part of
  # a real deploy -- nothing else would catch a regression in it before one. Its
  # rollback path drops every table and reloads a dump, so that is not a failure
  # mode to discover in production.
  test-deploy-script:
    name: Deploy script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the remote deploy script
        run: bash .github/scripts/deploy-remote-test.sh

  types-php:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run PHPStan
        run: composer types:check

  # composer.json requires ^8.4 while the other jobs run the newest PHP, so
  # run the suite on the supported floor as well.
  test-php:
    name: Pest (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          php-version: ${{ matrix.php-version }}

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Inertia-rendering Pest tests boot the real `app.blade.php` view,
      # which reads public/build/manifest.json via the @vite directive —
      # without a build, every one of those tests fails with "Vite
      # manifest not found" even though nothing here asserts on the built
      # JS itself. This also generates the Wayfinder actions as a
      # byproduct of the Vite plugin, same as the dedicated job above.
      - name: Build frontend assets
        run: npm run build

      - name: Run Pest
        run: composer test:pest

  # The suite runs on in-memory SQLite, but production is MySQL. These are the
  # migration tests whose behaviour differs between the two (foreign-key
  # indexes, fulltext, identifier lengths), run against a real MySQL server.
  # The whole tests/Feature/Database folder (~130 files, each migrating the
  # schema) ran past 20 minutes there without output, so only these run.
  test-php-mysql:
    name: Pest (MySQL migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: warehouse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: warehouse_test
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run database Pest tests on MySQL
        timeout-minutes: 10
        run: >-
          php artisan test
          tests/Feature/Database/DropRedundantForeignKeyIndexesTest.php
          tests/Feature/Database/SchemaIdentifierLengthTest.php
          tests/Feature/Database/AddFulltextIndexToProductsTableTest.php
          tests/Feature/Database/AddIndexesToStoreTablesTest.php
          tests/Feature/Database/LegacyCreateMigrationGuardsTest.php

  # `composer audit` reads composer.lock and `npm audit` reads
  # package-lock.json, so neither needs the dependencies installed. Abandoned
  # packages are reported but do not fail the run; advisories do.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --abandoned=report

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Ensure SQLite database files exist
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php -r "file_exists('database/telescope.sqlite') || touch('database/telescope.sqlite');"
          php -r "file_exists('database/pulse.sqlite') || touch('database/pulse.sqlite');"
          php -r "file_exists('database/health.sqlite') || touch('database/health.sqlite');"

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
