name: tests

# This workflow used to also run on pushes to main/develop/staging. That run
# existed to gate deploy.yml, which fired on a `workflow_run` completion of this
# workflow -- so every merge paid for a second full suite over content the PR had
# already tested green. (The old comment here justified it as testing a distinct
# commit because "merges here are fast-forward"; that was wrong. Merges into
# develop are real merge commits, but their tree is byte-identical to the PR head
# that was already tested, so the re-run could not produce a different result.)
#
# deploy.yml now triggers on the push directly and gates itself on finding a
# successful run of this workflow covering the merged tree, so the push run here
# bought nothing and has been removed. Use the workflow_dispatch below to run the
# full suite on a branch on demand -- notably to re-establish that gate when a
# merge lands content no PR run covered, because the base moved under the PR.
on:
  # Draft PRs are skipped (see the `plan` job); marking one ready runs the suite.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # deploy.yml calls this workflow when a merge lands content that no pull
  # request run covered, so the merged commit is tested before it is promoted.
  workflow_call:

permissions:
  contents: read

# This only deduplicates runs against the *same* ref, and deliberately does not
# touch the push-triggered run described above. PR runs group by PR number, so
# pushing again to a PR branch cancels only that PR's own superseded run. Every
# other event -- including the push run on develop/staging that deploy.yml gates
# on -- falls back to the run id, which is unique per run, so such a run can
# never be cancelled by, or queued behind, anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job runs on the team VPS's self-hosted Windows runners
# (docs/self-hosted-runner.md), never on GitHub-hosted minutes. The repository
# variable CI_RUNNER_LABELS overrides the labels for all jobs at once; it holds
# JSON, e.g. ["self-hosted","windows","warehouse-vps"] or "ubuntu-latest".
# Unset, the jobs wait for the VPS: there is no hosted fallback. Under
# workflow_call (deploy.yml) `vars` resolves in the caller's repository, which
# is this one. Steps that differ by runner test runner.environment
# ('github-hosted' or 'self-hosted'): a self-hosted runner brings PHP, Python,
# gh and Git Bash itself and keeps its own tool, Composer, npm and Playwright
# caches, so actions/cache and setup-php run only on GitHub-hosted runners.
#
# Every `run:` step is bash: Git for Windows' bash on the VPS, so the scripts
# stay POSIX and identical on a Linux runner.
defaults:
  run:
    shell: bash

jobs:
  # Enforces local attestation before any expensive job can start. Ordinary
  # code PRs need every planned group on the exact head and merged tree;
  # missing/stale/partial trailers and API failures fail this job closed.
  # Docs-only changes need nothing; .github/ changes ignore trailers and run
  # everything. Manual and deployment workflow calls also run everything.
  # Keep this job's check name stable and require "Plan CI jobs" in branch
  # protection. Draft PRs skip it and every job below.
  plan:
    name: Plan CI jobs
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      # Windows Python reads files, pipes and arguments in the ANSI code page
      # unless UTF-8 mode is on; commit messages and paths are UTF-8.
      PYTHONUTF8: '1'
    outputs:
      php: ${{ steps.plan.outputs.php }}
      mysql: ${{ steps.plan.outputs.mysql }}
      js: ${{ steps.plan.outputs.js }}
      e2e: ${{ steps.plan.outputs.e2e }}
      audit: ${{ steps.plan.outputs.audit }}
      deploy-script: ${{ steps.plan.outputs.deploy-script }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows/tests.yml
          sparse-checkout-cone-mode: false

      # python.org's Windows installer provides `python` and `py`, not
      # `python3` (where `python3` exists it may be the Microsoft Store alias,
      # which only opens the Store), so use the first that really runs 3.10+.
      - name: Find Python
        run: |
          for candidate in python3 python py; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 10))' > /dev/null 2>&1; then
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::No Python 3.10+ on PATH (tried python3, python and py).'
          exit 1

      - name: Test the planner
        run: '"$PYTHON" .github/scripts/ci_plan_test.py'

      - name: Decide which jobs this change needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Windows Python prints CRLF; a `true\r` output would never equal
          # 'true' and would skip every job, so strip the CR before the runner
          # reads the outputs. jq is not used: Git Bash does not ship it, and
          # gh's own --jq does the same job.
          finish() {
            echo "$1"
            "${PYTHON:-python3}" .github/scripts/ci_plan.py "${@:2}" | tr -d '\r' | tee -a "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            finish "A $EVENT_NAME run checks everything." --all
          fi

          tree_of() {
            gh api "repos/$REPO/commits/$1" --jq '.commit.tree.sha'
          }

          if ! merge_tree="$(tree_of "$MERGE_SHA")" || ! head_tree="$(tree_of "$HEAD_SHA")" \
            || ! gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message' > "$RUNNER_TEMP/head-message.txt"; then
            echo '::error::Could not read the PR commits; refusing to start paid CI without verifying attestation.'
            exit 1
          fi

          # The files API lists at most 3000 files; incomplete coverage cannot
          # establish either an exemption or a valid attestation.
          if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo '::error::Could not list the PR files; refusing to start paid CI.'
            exit 1
          fi

          if [ "$(wc -l <<< "$files")" -ge 3000 ]; then
            echo '::error::The PR lists 3000+ files; split it so attestation coverage can be verified.'
            exit 1
          fi

          echo "$files"
          finish "Verifying attestation for the changed paths above:" \
            --require-attestation --attested-message-file "$RUNNER_TEMP/head-message.txt" \
            --tree "$head_tree" --merged-tree "$merge_tree" <<< "$files"

  format-js:
    name: Prettier
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Prettier
        run: npm run format:check

  # ESLint, vue-tsc and Vitest all resolve real imports from the gitignored,
  # generated resources/js/actions and resources/js/wayfinder (`php artisan
  # wayfinder:generate`, the command the Vite Wayfinder plugin also shells
  # out to on build). They run as one job that generates the types once and
  # then runs the three checks. Billing rounds every job up to a whole minute
  # and each repeats checkout and dependency install, so five small jobs
  # (generate, ESLint, vue-tsc, Vitest, and their artifact hand-off) cost more
  # than this one. Each check runs even if an earlier one failed, so a single
  # run reports every failure.
  js-checks:
    name: JS checks (ESLint, vue-tsc, Vitest)
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Generate Wayfinder actions
        run: php artisan wayfinder:generate --skip-routes --with-form

      - name: Run ESLint
        run: npm run lint:check

      - name: Run vue-tsc
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Run Vitest
        if: ${{ !cancelled() }}
        run: npm run test:unit

  lint-php:
    name: Pint
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run Pint
        run: composer lint:check

  # deploy-remote.sh only ever runs on the Hostinger host, over SSH, as part of
  # a real deploy -- nothing else would catch a regression in it before one. Its
  # rollback path drops every table and reloads a dump, so that is not a failure
  # mode to discover in production.
  #
  # The script and its test need real symlinks (`current`, shared storage,
  # .env and public entries, one of them dangling). Git for Windows' bash
  # copies on `ln -s` by default; winsymlinks:sys makes it write MSYS symlinks,
  # which every bash tool here sees as symlinks, need no Windows privilege and
  # may dangle. Native symlinks (nativestrict) refuse a missing target. No
  # effect on Linux.
  test-deploy-script:
    name: Deploy script
    needs: plan
    if: needs.plan.outputs.deploy-script == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    env:
      MSYS: winsymlinks:sys
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the remote deploy script
        run: bash .github/scripts/deploy-remote-test.sh

  types-php:
    name: PHPStan
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run PHPStan
        run: composer types:check

  test-php:
    name: Pest
    needs: [plan, lint-php, format-js]
    # Prettier is skipped when only PHP files changed, and Pint when a head-commit
    # attestation already vouches for the php group, and a skipped need would
    # skip this job too, so require each to have passed or been skipped --
    # never failed or cancelled.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.php == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Inertia-rendering Pest tests boot the real `app.blade.php` view,
      # which reads public/build/manifest.json via the @vite directive —
      # without a build, every one of those tests fails with "Vite
      # manifest not found" even though nothing here asserts on the built
      # JS itself. This also generates the Wayfinder actions as a
      # byproduct of the Vite plugin, same as the dedicated job above.
      - name: Build frontend assets
        run: npm run build

      # `composer test:pest` runs the suite in one process: about 6.5 minutes,
      # the longest job in the workflow. Paratest (already a Pest dependency)
      # splits it across the runner's cores; every test uses its own in-memory
      # SQLite database, and the same `--parallel` run is what
      # pre_push_check.py uses locally.
      - name: Run Pest
        run: |
          php artisan config:clear --ansi
          php artisan test --parallel

  # The suite runs on in-memory SQLite, but production is MySQL. These are the
  # migration tests whose behaviour differs between the two (foreign-key
  # indexes, fulltext, identifier lengths), run against a real MySQL server.
  # The whole tests/Feature/Database folder (~130 files, each migrating the
  # schema) ran past 20 minutes there without output, so only these run.
  test-php-mysql:
    name: Pest (MySQL migrations)
    needs: [plan, lint-php, format-js]
    # Prettier is skipped when only PHP files changed, and Pint when a head-commit
    # attestation already vouches for the php group, and a skipped need would
    # skip this job too, so require each to have passed or been skipped --
    # never failed or cancelled.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.mysql == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    # No `services:` container: those run only on Linux runners. The VPS runs
    # one native MySQL 8.4 service that all its runner instances share
    # (docs/self-hosted-runner.md); each job creates, migrates and drops a
    # database of its own (.github/scripts/ci-mysql.php), named after the
    # runner, run and attempt, so concurrent jobs never meet. The server and
    # account come from the runner's environment (CI_MYSQL_HOST, CI_MYSQL_PORT,
    # CI_MYSQL_USER, CI_MYSQL_PASSWORD), not from the repository. No DB_* is set
    # here: setup-backend migrates its usual SQLite, and the create step below
    # points every later step at the job's MySQL database.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A GitHub-hosted runner (CI_RUNNER_LABELS="ubuntu-latest") has no MySQL
      # 8.4 of its own, so it starts the image the job used to run as a
      # service. It starts while the backend installs; the check below waits.
      - name: Start MySQL 8.4 (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: |
          docker run --detach --name ci-mysql --publish 127.0.0.1:3306:3306 \
            --env MYSQL_ROOT_PASSWORD=password mysql:8.4
          {
            echo 'CI_MYSQL_HOST=127.0.0.1'
            echo 'CI_MYSQL_PORT=3306'
            echo 'CI_MYSQL_USER=root'
            echo 'CI_MYSQL_PASSWORD=password'
            echo 'CI_MYSQL_WAIT_SECONDS=120'
          } >> "$GITHUB_ENV"

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      # Fails naming the missing CI_MYSQL_* setting, or the address it could
      # not reach, instead of letting migrations fail on a connection error.
      - name: Check the runner's MySQL
        run: php .github/scripts/ci-mysql.php check

      - name: Create this job's MySQL database
        id: database
        run: php .github/scripts/ci-mysql.php create

      # What setup-backend's migrate did when this job set DB_* job-wide: a
      # full migration on MySQL, which the build below also needs, since
      # Wayfinder boots controllers that read settings from the database.
      - name: Migrate this job's MySQL database
        run: php artisan migrate --force

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # These tests also render Inertia pages, which require the Vite manifest.
      - name: Build frontend assets
        run: npm run build

      - name: Run database Pest tests on MySQL
        timeout-minutes: 10
        run: >-
          php artisan test
          tests/Feature/StorefrontRegistrationFieldsTest.php
          tests/Feature/Database/WidenPaymentTransactionCodeTest.php
          tests/Feature/Store/Admin/SellerPayoutDefectsTest.php
          tests/Feature/SellerDashboardTest.php
          tests/Feature/Store/Admin/ProductEditRoutingTest.php
          tests/Feature/Store/Admin/RootProductHandlersTest.php
          tests/Feature/Store/Admin/TripWriteScopingTest.php
          tests/Feature/StorefrontNullSlugTest.php
          tests/Feature/StorefrontRemainingBladeUrlTest.php
          tests/Feature/StorefrontRemainingResourceUrlTest.php
          tests/Feature/Store/Admin/DynamicPopupControllerTest.php
          tests/Feature/Store/Admin/CustomerControllerTest.php
          tests/Feature/Database/DropRedundantForeignKeyIndexesTest.php
          tests/Feature/Database/SchemaIdentifierLengthTest.php
          tests/Feature/Database/AddFulltextIndexToProductsTableTest.php
          tests/Feature/Database/AddIndexesToStoreTablesTest.php
          tests/Feature/Database/AddUniqueIndexToUsersTaxNumberTest.php
          tests/Feature/Database/LoadLegacyReferenceDataTest.php
          tests/Feature/Database/WidenMapLongitudeColumnsTest.php
          tests/Feature/Database/AddSyncedAtToProductsTableTest.php
          tests/Feature/Console/SyncProductsCommandTest.php
          tests/Feature/ProductColumnOwnershipTest.php
          tests/Feature/SellerProductPersistenceTest.php
          tests/Feature/SellerDigitalProductPersistenceTest.php
          tests/Feature/SellerCatalogueRowRulesTest.php
          tests/Feature/Store/Admin/ProductMySqlEditTest.php

      # Runs whatever happened above, and never fails the job: a database a
      # killed job leaves behind is dropped by the next create on this runner.
      - name: Drop this job's MySQL database
        if: always()
        run: php .github/scripts/ci-mysql.php drop

  # `composer audit` reads composer.lock and `npm audit` reads
  # package-lock.json, so neither needs the dependencies installed. Abandoned
  # packages are reported but do not fail the run; advisories do.
  audit:
    name: Dependency audit
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-php warns against several self-hosted runners on one machine
      # (parallel jobs conflict over its global PHP install), so a self-hosted
      # runner brings its own PHP; see the same split in setup-backend.
      - name: Setup PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Check the runner's PHP
        if: runner.environment != 'github-hosted'
        run: bash .github/scripts/require-php.sh 8.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --abandoned=report

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E
    needs: [plan, lint-php, format-js]
    # Pint and Prettier are skipped when their group is not planned, which
    # includes a group a head-commit attestation already vouches for, so a
    # skipped need must not skip this job too.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.e2e == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-php.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.format-js.result)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Ensure SQLite database files exist
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php -r "file_exists('database/telescope.sqlite') || touch('database/telescope.sqlite');"
          php -r "file_exists('database/pulse.sqlite') || touch('database/pulse.sqlite');"
          php -r "file_exists('database/health.sqlite') || touch('database/health.sqlite');"

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      # One browser directory per runner: the tool cache is per runner
      # instance, so runners sharing the VPS never install into the same
      # directory, and a self-hosted runner keeps its browser between jobs.
      # The default (~/.cache/ms-playwright on Linux, %LOCALAPPDATA% on
      # Windows) would be shared by every runner under one account.
      - name: Locate Playwright browsers
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --with-deps installs system libraries with apt on Linux, and on Windows
      # Server runs Install-WindowsFeature Server-Media-Foundation, which needs
      # administrator rights. A self-hosted runner is provisioned with those
      # once (docs/self-hosted-runner.md) instead of on every job. A missing
      # library breaks the browser and fails the tests; it cannot pass one.
      - name: Install Playwright Browsers
        env:
          HOSTED_RUNNER: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED_RUNNER" = true ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # Runner instances sharing the VPS can run this job at the same time, so
      # each needs its own E2E_PORT/E2E_BACKEND_PORT pair in its .env (runner N:
      # 8010+2N and 8011+2N; tests/e2e/support/ports.mjs). Fail here, naming the
      # setting, rather than with Playwright's "already used".
      - name: Check the E2E ports are free
        run: node tests/e2e/support/ports.mjs --check

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
