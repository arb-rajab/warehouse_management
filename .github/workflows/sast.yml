name: sast

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.155.0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the Semgrep report script
        run: python3 .github/scripts/semgrep_report_test.py -v

      - name: Run Semgrep
        continue-on-error: true
        run: >
          semgrep scan
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/secrets
          --config p/php
          --config p/javascript
          --config p/typescript
          --json
          --output semgrep-results.json

      - name: Summarize results and enforce ERROR severity gate
        run: python3 .github/scripts/semgrep_report.py semgrep-results.json "$GITHUB_STEP_SUMMARY"

      - name: Upload full Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
