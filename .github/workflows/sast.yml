name: sast

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a PR branch is pushed again before the previous
# scan finished. PR runs group by PR number, so only that PR's own stale run is
# cancelled. Every other event — notably the push run on main/develop — falls
# back to the run id, which is unique per run, so a push run can never be
# cancelled by, or queued behind, anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Both jobs run on the team VPS's self-hosted Windows runners, like tests.yml
# (docs/self-hosted-runner.md): CI_RUNNER_LABELS overrides the labels, and every
# `run:` step is Git for Windows' bash, so the scripts stay POSIX and identical
# on a Linux runner. Git Bash has no jq; gh's own --jq does that job.
defaults:
  run:
    shell: bash

jobs:
  # Merging a PR into main/develop lands a merge commit whose tree is usually
  # identical to the PR head this workflow already scanned — the merge adds no
  # content of its own when nothing else landed on the base in between. That held
  # for 23 of the last 25 merges into develop; in the other 2 the base had moved,
  # the merge combined branches into content nothing had scanned, and the tree
  # check below correctly falls through to a full scan. Semgrep scans file
  # content, so re-scanning an identical tree cannot produce a different result.
  #
  # The push trigger is kept rather than dropped the way tests.yml's was: nothing
  # gates on this workflow, so there is no deploy to feed, but a push run is now
  # the only verification that still fires on a commit landing directly on
  # main/develop without a PR. The gate makes that cheap -- when the content was
  # already scanned it costs one short job instead of a full container scan.
  #
  # The scan is skipped only when the content is provably identical: the pushed
  # commit is a two-parent merge whose tree matches its second parent, and that
  # parent already has a successful `sast` run. Everything else falls through to
  # a full scan — a squash merge, a direct push, a base that moved under the PR,
  # no prior run, a prior run that failed, or an API error.
  #
  # Note the skip is a job-level `if:`, not a narrowing of the `on:` triggers: a
  # job skipped by a conditional still reports a check run (GitHub reports it as
  # successful), so branch protection requiring `sast` always gets a conclusion.
  # Pull request events never consult this at all, so the checks a PR must pass
  # are completely unchanged.
  resolve-scanned-commit:
    name: Check for an existing scan of this tree
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      already-scanned: ${{ steps.lookup.outputs.already-scanned }}
    steps:
      - name: Look for a successful scan of the same content
        id: lookup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # One call for the tree and the merged head (empty unless the commit
          # has exactly two parents), on one line.
          if ! head_commit="$(gh api "repos/$REPO/commits/$HEAD_SHA" \
            --jq '.commit.tree.sha + " " + (if (.parents | length) == 2 then .parents[1].sha else "" end)')"; then
            echo "Could not read $HEAD_SHA; scanning."
            exit 0
          fi

          read -r head_tree pr_head <<< "$head_commit"

          if [ -z "$pr_head" ]; then
            echo "$HEAD_SHA is not a two-parent merge commit; scanning."
            exit 0
          fi

          if ! pr_head_tree="$(gh api "repos/$REPO/commits/$pr_head" --jq '.commit.tree.sha')"; then
            echo "Could not read merged head $pr_head; scanning."
            exit 0
          fi

          if [ "$head_tree" != "$pr_head_tree" ]; then
            echo "Merge tree $head_tree differs from $pr_head's tree $pr_head_tree; scanning."
            exit 0
          fi

          successful_runs="$(gh api \
            "repos/$REPO/actions/workflows/sast.yml/runs?head_sha=$pr_head&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)"

          if [ "${successful_runs:-0}" -gt 0 ]; then
            echo "already-scanned=true" >> "$GITHUB_OUTPUT"
            echo "Tree $head_tree was already scanned successfully at $pr_head; skipping the re-scan."
          else
            echo "No successful sast run for $pr_head; scanning."
          fi

  # Semgrep runs natively, not in the semgrep/semgrep image: job containers run
  # only on Linux runners. Semgrep publishes an official win_amd64 wheel for
  # this exact version (with Windows in its PyPI classifiers and a pywin32
  # dependency for win32), and its docs install the Windows CLI with pipx or
  # uv, i.e. into a virtual environment, which is what the install step does:
  # a fresh venv per job under RUNNER_TEMP, so the several runner instances on
  # the VPS never share or race over an install. Semgrep's Windows support is
  # newer than its Linux one; the summary prints how many files were scanned,
  # and semgrep_report.py fails a scan that covered none.
  semgrep:
    needs: resolve-scanned-commit
    if: needs.resolve-scanned-commit.outputs.already-scanned != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","windows","warehouse-vps"]') }}
    timeout-minutes: 30
    env:
      SEMGREP_VERSION: 1.155.0
      # Windows Python reads files, pipes and arguments in the ANSI code page
      # unless UTF-8 mode is on; the scanned sources are UTF-8.
      PYTHONUTF8: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python.org's Windows installer provides `python` and `py`, not
      # `python3` (where `python3` exists it may be the Microsoft Store alias,
      # which only opens the Store), so use the first that really runs 3.10+,
      # which Semgrep also requires. Same as the plan job in tests.yml.
      - name: Find Python
        run: |
          for candidate in python3 python py; do
            if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 10))' > /dev/null 2>&1; then
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::No Python 3.10+ on PATH (tried python3, python and py).'
          exit 1

      - name: Test the Semgrep report script
        run: '"$PYTHON" .github/scripts/semgrep_report_test.py -v'

      # --only-binary keeps pip from ever building Semgrep from source (that
      # needs OCaml); it must install the published wheel. Semgrep's settings
      # and version cache go to per-job folders instead of the runner user's
      # home, which every runner instance on the VPS shares.
      - name: Install Semgrep
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/semgrep-config" XDG_CACHE_HOME="$RUNNER_TEMP/semgrep-cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          venv="$RUNNER_TEMP/semgrep-venv"
          "$PYTHON" -m venv "$venv"
          if [ -d "$venv/Scripts" ]; then bin="$venv/Scripts"; else bin="$venv/bin"; fi
          "$bin/python" -m pip install --disable-pip-version-check --quiet \
            --only-binary semgrep "semgrep==$SEMGREP_VERSION"

          installed="$("$bin/semgrep" --version | tr -d '\r')"
          if [ "$installed" != "$SEMGREP_VERSION" ]; then
            echo "::error::Installed Semgrep reports '$installed', expected $SEMGREP_VERSION."
            exit 1
          fi

          {
            echo "SEMGREP=$bin/semgrep"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
          } >> "$GITHUB_ENV"
          echo "Semgrep $installed in $venv"

      - name: Run Semgrep
        continue-on-error: true
        run: >
          "$SEMGREP" scan
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/secrets
          --config p/php
          --config p/javascript
          --config p/typescript
          --json
          --output semgrep-results.json

      - name: Summarize results and enforce ERROR severity gate
        run: '"$PYTHON" .github/scripts/semgrep_report.py semgrep-results.json "$GITHUB_STEP_SUMMARY"'

      - name: Upload full Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
