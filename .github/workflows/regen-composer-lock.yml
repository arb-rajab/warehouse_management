name: Regenerate composer.lock (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen-lock:
    name: composer update (new packages only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Update composer.lock for the packages merged from albaraka-holland
        run: |
          composer update \
            enshrined/svg-sanitize \
            genealabs/laravel-sign-in-with-apple \
            genealabs/laravel-socialiter \
            giggsey/libphonenumber-for-php \
            google/apiclient \
            guzzlehttp/guzzle \
            intervention/image \
            iyzico/iyzipay-php \
            laracasts/flash \
            laravel/socialite \
            laravel/ui \
            league/flysystem-aws-s3-v3 \
            maatwebsite/excel \
            niklasravnsborg/laravel-pdf \
            setasign/fpdf \
            setasign/fpdi \
            simplesoftwareio/simple-qrcode \
            tecnickcom/tcpdf \
            --with-dependencies --no-interaction --no-scripts

      - name: Commit and push composer.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already up to date, nothing to commit."
          else
            git commit -m "Regenerate composer.lock for packages merged from albaraka-holland"
            git push
          fi
