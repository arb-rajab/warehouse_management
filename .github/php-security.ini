; Additional safeguards for CVE-2026-109619. Both PHP2Shell CVEs require
; PHP 8.5.12 or later; these settings do not replace upgrading the runtime.
; https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
; Load in startup php.ini/conf.d for each web SAPI and restart all workers.
; Laravel/Inertia uploads use browser progress events, not PHP session tracking.
session.upload_progress.enabled = Off
fatal_error_backtraces = Off
